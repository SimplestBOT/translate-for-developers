# Release: on tag push (v*), build + test + package portable zip + attach to
# GitHub Release. Asset layout per package-release.ps1 (whitelist; includes
# translator-uia.exe). Scoop/winget manifests consume this zip URL + SHA256
# (see packaging/README.md for the manual publishing steps).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate Windows SDK winmd
        shell: pwsh
        run: |
          $md = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\UnionMetadata\*\Windows.winmd' -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Name } -Descending | Select-Object -First 1
          if ($md) {
            Write-Host "winmd: $($md.FullName)"
            Add-Content $env:GITHUB_ENV "WINMD=$($md.FullName)"
          } else {
            Write-Host "::warning::no Windows.winmd in runner image - OCR code will fail to compile"
          }

      - name: Build C#
        shell: pwsh
        run: |
          $p = @()
          if ($env:WINMD) { $p += "-p:WindowsWinMd=$env:WINMD" }
          dotnet build src/csharp/TranslatorCore/TranslatorCore.csproj -c Release @p
          dotnet build src/csharp/TranslatorHost/TranslatorHost.csproj -c Release @p
          dotnet build src/csharp/TranslatorUia/TranslatorUia.csproj -c Release

      - name: Build WebUI (5 pages)
        shell: bash
        working-directory: src/webui
        run: |
          npm ci
          for p in settings result capture config input; do
            TFD_PAGE=$p npm run build
          done

      - name: Core tests
        run: dotnet run --project src/csharp/TranslatorCore.Tests -c Release --no-build

      - name: Package portable zip
        shell: pwsh
        run: ./package-release.ps1 -Version $env:GITHUB_REF_NAME

      - name: Show package hash (for scoop/winget manifests)
        shell: pwsh
        run: |
          Get-ChildItem release-pkg/*.zip | ForEach-Object {
            $h = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            Add-Content $env:GITHUB_STEP_SUMMARY ("`"{0}`" sha256: `{1}`" -f $_.Name, $h)
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-pkg/*.zip
          generate_release_notes: true
